name: Publish Physical Systems npm preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physicalsystems-npm-preview-publish
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.2.1
  PI_RUNTIME_VERSION: 0.84.2-tinyedge.1
  NODE_VERSION: 22.19.0
  # Keep the exact packaging/publishing CLI fixed. Consumer verification also
  # exercises the npm 12 behavior supported by current Node 24 releases.
  NPM_VERSION: 11.19.0
  CONSUMER_NPM_VERSION: 12.0.2
  NPM_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RELEASE_ARTIFACT_DIRECTORY: release-artifacts
  RELEASE_ARTIFACT_NAME: physicalsystems-npm-0.2.1-${{ github.sha }}-${{ github.run_attempt }}

jobs:
  require-main:
    name: Require a manual main-branch dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Refuse release while npm publication approval is pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e NPM-RELEASE-PENDING.md ]]; then
            echo "::error title=npm release pending::NPM-RELEASE-PENDING.md is present; source licensing does not authorize building or publishing npm release packages"
            exit 1
          fi
      - name: Refuse release while source licensing is pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e LICENSE-PENDING.md ]]; then
            echo "::error title=License pending::LICENSE-PENDING.md is present; this export candidate must not build or publish release packages"
            exit 1
          fi
      - name: Refuse every repository, event, or ref except Physical Systems main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "PhysicalSystems/physicalsystems"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify the public/private source boundary
        run: node scripts/check-export-boundary.mjs
      - name: Require all reviewed pinned Node manifests before npm release packaging
        run: node scripts/check-node-release-index.mjs
      - name: Check coordinated product pins before release packaging
        run: node scripts/release.mjs check

  build:
    name: Pack the Windows x64 candidate once
    needs: require-main
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.candidate.outputs.name }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.candidate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false
      - name: Install the pinned trusted-publishing npm CLI
        shell: pwsh
        run: |
          npm install --global "npm@$env:NPM_VERSION" --registry="$env:NPM_REGISTRY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualVersion = (npm --version).Trim()
          if ($actualVersion -ne $env:NPM_VERSION) {
            throw "Expected npm $env:NPM_VERSION, received $actualVersion"
          }
      - name: Require the exact package and dependency contract
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'

          const root = process.env.GITHUB_WORKSPACE
          const expectedVersion = process.env.RELEASE_VERSION
          const expectedRuntimeVersion = process.env.PI_RUNTIME_VERSION
          assert.equal(expectedVersion, '0.2.1')
          assert.equal(expectedRuntimeVersion, '0.84.2-tinyedge.1')

          const readPackage = (directory) => JSON.parse(
            readFileSync(path.join(root, directory, 'package.json'), 'utf8'),
          )
          const physicalsystems = readPackage('packages/cli')
          const legacyPi = readPackage('packages/pi')
          const legacyFacade = readPackage('packages/npx')
          const runtime = readPackage('packages/pi-runtime')

          assert.equal(physicalsystems.name, 'physicalsystems')
          assert.equal(legacyPi.name, '@tinyedge/pi')
          assert.equal(legacyFacade.name, 'tinyedge')
          assert.equal(runtime.name, '@tinyedge/pi-runtime')
          assert.deepEqual(physicalsystems.bin, { physicalsystems: 'bin/physicalsystems.js' })
          assert.equal(runtime.version, expectedRuntimeVersion)
          assert.equal(runtime.license, 'MIT')
          assert.equal(runtime.bin, undefined)
          assert.equal(physicalsystems.version, expectedVersion)
          assert.deepEqual(physicalsystems.os, ['win32', 'linux'])
          assert.equal(physicalsystems.engines?.node, '>=22.19.0')
          assert.equal(physicalsystems.publishConfig?.access, 'public')
          assert.equal(physicalsystems.bundleDependencies, true)
          for (const legacy of [legacyPi, legacyFacade]) {
            assert.equal(legacy.version, '0.1.3')
            assert.equal(legacy.private, true)
          }
          assert.equal(runtime.engines?.node, '>=22.19.0')
          assert.equal(runtime.repository?.url, 'git+https://github.com/TinyEdgeAI/tinyedge-edge.git')
          assert.equal(physicalsystems.dependencies?.['@tinyedge/pi-runtime'], expectedRuntimeVersion)
          assert.equal(physicalsystems.dependencies?.['@tinyedge/cli'], undefined)

          const lock = JSON.parse(
            readFileSync(path.join(root, 'packages/cli/package-lock.json'), 'utf8'),
          )
          assert.equal(lock.version, expectedVersion)
          assert.equal(lock.packages?.['']?.version, expectedVersion)
          assert.equal(lock.packages?.['']?.dependencies?.['@tinyedge/pi-runtime'], expectedRuntimeVersion)
          assert.deepEqual(
            [...lock.packages?.['']?.bundleDependencies || []].sort(),
            Object.keys(lock.packages?.['']?.dependencies || {}).sort(),
          )
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare one small product with pinned backend manifests and a SHA-256 manifest
        shell: pwsh
        run: |
          $productDirectory = Join-Path $env:RUNNER_TEMP 'physicalsystems-product'
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ARTIFACT_DIRECTORY
          npm run release:prepare -- --output $productDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $artifactDirectory) { throw 'Candidate output already exists' }
          Copy-Item -LiteralPath (Join-Path $productDirectory 'candidate') -Destination $artifactDirectory -Recurse
      - name: Run package source and SDK checks
        shell: pwsh
        run: |
          npm --prefix packages/pi-runtime test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/cli run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/cli run check:pi-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/cli test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record candidate identity
        id: candidate
        shell: pwsh
        run: |
          "name=$env:RELEASE_ARTIFACT_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $manifestPath = Join-Path $env:RELEASE_ARTIFACT_DIRECTORY 'release-manifest.json'
          $manifestSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "manifest-sha256=$manifestSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "## Packed npm candidate" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Artifact: ``$env:RELEASE_ARTIFACT_NAME``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -Raw $manifestPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload the immutable candidate tarballs and checksum manifest
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify:
    name: Verify on Windows ${{ matrix.architecture }} with npm ${{ matrix.npm-version }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            npm-version: 11.19.0
            node-version: 22.19.0
          - architecture: x64
            runner: windows-latest
            npm-version: 12.0.2
            node-version: 24.15.0
          - architecture: arm64
            runner: windows-11-arm
            npm-version: 11.19.0
            node-version: 22.19.0
          - architecture: arm64
            runner: windows-11-arm
            npm-version: 12.0.2
            node-version: 24.15.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Install the pinned consumer npm CLI
        shell: pwsh
        run: |
          npm install --global "npm@${{ matrix.npm-version }}" --registry="$env:NPM_REGISTRY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualVersion = (npm --version).Trim()
          if ($actualVersion -ne '${{ matrix.npm-version }}') {
            throw "Expected npm ${{ matrix.npm-version }}, received $actualVersion"
          }
          if ("$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)".ToLowerInvariant() -ne '${{ matrix.architecture }}') {
            throw "Expected the ${{ matrix.architecture }} runner architecture"
          }
          $actualNodeArchitecture = (node -p 'process.arch').Trim()
          if ($actualNodeArchitecture -ne '${{ matrix.architecture }}') {
            throw "Expected a ${{ matrix.architecture }} Node.js runtime, received $actualNodeArchitecture"
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.architecture == 'x64'
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download the build job's exact tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
      - name: Verify checksums, lifecycle installs, command shims, Harness dispatch, Pi, and native bindings
        shell: pwsh
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ARTIFACT_DIRECTORY
          $manifestPath = Join-Path $artifactDirectory 'release-manifest.json'
          $actualManifestSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualManifestSha256 -ne $env:EXPECTED_MANIFEST_SHA256) {
            throw "Downloaded release manifest digest $actualManifestSha256 does not match trusted build output $env:EXPECTED_MANIFEST_SHA256"
          }
          npm --prefix packages/cli run release:verify -- $artifactDirectory --require-downloadable-node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record architecture verification evidence
        shell: pwsh
        env:
          SOURCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ARTIFACT_DIRECTORY
          $evidenceDirectory = Join-Path $env:GITHUB_WORKSPACE 'verification-evidence'
          New-Item -ItemType Directory -Path $evidenceDirectory | Out-Null
          $tarballs = Get-ChildItem -LiteralPath $artifactDirectory -Filter '*.tgz' | Sort-Object Name | ForEach-Object {
            [ordered]@{
              filename = $_.Name
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $evidence = [ordered]@{
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            runner = '${{ matrix.runner }}'
            architecture = '${{ matrix.architecture }}'
            osArchitecture = "$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)".ToLowerInvariant()
            processArchitecture = (node -p 'process.arch').Trim()
            node = (node --version).Trim()
            npm = (npm --version).Trim()
            sourceArtifactDigest = $env:SOURCE_ARTIFACT_DIGEST
            manifestSha256 = (Get-FileHash -LiteralPath (Join-Path $artifactDirectory 'release-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            tarballs = @($tarballs)
          }
          $evidencePath = Join-Path $evidenceDirectory "verification-${{ matrix.architecture }}-npm-${{ matrix.npm-version }}.json"
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          "## Windows ${{ matrix.architecture }} / npm ${{ matrix.npm-version }} verification" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -Raw $evidencePath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload architecture verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physicalsystems-npm-verification-${{ matrix.architecture }}-npm-${{ matrix.npm-version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: verification-evidence/verification-${{ matrix.architecture }}-npm-${{ matrix.npm-version }}.json
          if-no-files-found: error
          retention-days: 30

  verify-linux:
    name: Verify on ${{ matrix.runner }} x64 with npm ${{ matrix.npm-version }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            npm-version: 11.19.0
            node-version: 22.19.0
            python-version: '3.10'
          - runner: ubuntu-22.04
            npm-version: 12.0.2
            node-version: 24.15.0
            python-version: '3.10'
          - runner: ubuntu-24.04
            npm-version: 11.19.0
            node-version: 22.19.0
            python-version: '3.12'
          - runner: ubuntu-24.04
            npm-version: 12.0.2
            node-version: 24.15.0
            python-version: '3.12'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          architecture: x64
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Verify managed Node Python prerequisites
        shell: bash
        run: |
          python3 -I -c 'import sys, venv, ensurepip; assert "%s.%s" % sys.version_info[:2] == "${{ matrix.python-version }}"'
      - name: Install the pinned consumer npm CLI and Linux desktop prerequisites
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@${{ matrix.npm-version }}" --registry="$NPM_REGISTRY"
          test "$(npm --version)" = '${{ matrix.npm-version }}'
          test "$(node -p 'process.platform')" = linux
          test "$(node -p 'process.arch')" = x64
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools xdg-utils
          command -v secret-tool
          command -v xdg-open
      - name: Download the build job's exact tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
      - name: Verify checksums, lifecycle installs, POSIX shims, Secret Service, Pi, and interactive Harness
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          artifact_directory="$GITHUB_WORKSPACE/$RELEASE_ARTIFACT_DIRECTORY"
          manifest_path="$artifact_directory/release-manifest.json"
          actual_manifest_sha256="$(sha256sum "$manifest_path" | cut -d' ' -f1)"
          test "$actual_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          runtime_directory="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$runtime_directory"
          trap 'rm -rf "$runtime_directory"' EXIT
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "%s" "tinyedge-ephemeral-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            npm --prefix packages/cli run release:verify -- "$GITHUB_WORKSPACE/$RELEASE_ARTIFACT_DIRECTORY" --require-downloadable-node
          '
      - name: Record Linux verification evidence
        shell: bash
        env:
          SOURCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          mkdir -p verification-evidence
          evidence_path="verification-evidence/verification-${{ matrix.runner }}-npm-${{ matrix.npm-version }}.json"
          node --input-type=module <<'NODE' > "$evidence_path"
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync } from 'node:fs'
          import path from 'node:path'

          const directory = path.join(process.env.GITHUB_WORKSPACE, process.env.RELEASE_ARTIFACT_DIRECTORY)
          const sha256 = (file) => createHash('sha256').update(readFileSync(file)).digest('hex')
          const evidence = {
            version: process.env.RELEASE_VERSION,
            commit: process.env.GITHUB_SHA,
            runner: '${{ matrix.runner }}',
            architecture: process.arch,
            platform: process.platform,
            node: process.version,
            npm: '${{ matrix.npm-version }}',
            sourceArtifactDigest: process.env.SOURCE_ARTIFACT_DIGEST,
            manifestSha256: sha256(path.join(directory, 'release-manifest.json')),
            tarballs: readdirSync(directory)
              .filter((file) => file.endsWith('.tgz'))
              .sort()
              .map((filename) => ({ filename, sha256: sha256(path.join(directory, filename)) })),
          }
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`)
          NODE
          cat "$evidence_path" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physicalsystems-npm-verification-${{ matrix.runner }}-npm-${{ matrix.npm-version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: verification-evidence/verification-${{ matrix.runner }}-npm-${{ matrix.npm-version }}.json
          if-no-files-found: error
          retention-days: 30

  verify-unsupported-node:
    name: Verify the exact candidate fails clearly on Node 12
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the exact prerequisite assertion
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 12.22.9
          architecture: x64
          package-manager-cache: false
      - name: Install the npm version from the reported Ubuntu failure
        shell: bash
        run: |
          set -euo pipefail
          npm install --global 'npm@8.5.1' --registry="$NPM_REGISTRY"
          test "$(node --version)" = 'v12.22.9'
          test "$(npm --version)" = '8.5.1'
      - name: Download the build job's exact tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
      - name: Reproduce the old-npm launch without parsing modern application code
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
        run: |
          set -euo pipefail
          artifact_directory="$GITHUB_WORKSPACE/$RELEASE_ARTIFACT_DIRECTORY"
          manifest_path="$artifact_directory/release-manifest.json"
          artifact_path="$artifact_directory/physicalsystems-$RELEASE_VERSION.tgz"
          actual_manifest_sha256="$(sha256sum "$manifest_path" | cut -d' ' -f1)"
          test "$actual_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          test -f "$artifact_path"
          MANIFEST_PATH="$manifest_path" ARTIFACT_PATH="$artifact_path" node <<'NODE'
          const assert = require('assert').strict
          const { createHash } = require('crypto')
          const { readFileSync } = require('fs')
          const path = require('path')

          const manifest = JSON.parse(readFileSync(process.env.MANIFEST_PATH, 'utf8'))
          assert.equal(manifest.schemaVersion, 1)
          assert.equal(manifest.version, process.env.RELEASE_VERSION)
          assert.equal(manifest.commit, process.env.GITHUB_SHA)
          const artifact = manifest.artifacts.find(function (entry) {
            return entry.key === 'physicalsystems'
          })
          assert.ok(artifact, 'release manifest is missing physicalsystems')
          assert.equal(artifact.name, 'physicalsystems')
          assert.equal(artifact.version, process.env.RELEASE_VERSION)
          assert.equal(artifact.filename, `physicalsystems-${process.env.RELEASE_VERSION}.tgz`)
          assert.equal(path.basename(process.env.ARTIFACT_PATH), artifact.filename)
          assert.equal(
            createHash('sha256').update(readFileSync(process.env.ARTIFACT_PATH)).digest('hex'),
            artifact.sha256,
          )
          NODE

          unpacked="$RUNNER_TEMP/physicalsystems-node12-candidate"
          mkdir -p "$unpacked"
          tar -xzf "$artifact_path" -C "$unpacked"
          node packages/cli/scripts/check-unsupported-node.cjs "$unpacked/package/bin/physicalsystems.js"

          stdout="$RUNNER_TEMP/physicalsystems-node12.stdout"
          stderr="$RUNNER_TEMP/physicalsystems-node12.stderr"
          set +e
          npm exec --yes --package="$artifact_path" -- physicalsystems >"$stdout" 2>"$stderr"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$stdout"
          grep -F "Physical Systems requires Node.js 22.19.0 or newer (detected 12.22.9). Upgrade Node.js and run the command again." "$stderr"
          if grep -E 'SyntaxError|src[/\\]auth[/\\]redact\.js' "$stderr"; then
            echo 'The unsupported runtime reached modern application code' >&2
            exit 1
          fi

  publish:
    name: Publish physicalsystems 0.2.1 to preview with npm OIDC
    needs:
      - build
      - verify
      - verify-linux
      - verify-unsupported-node
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read # Read the protected environment and deployment-branch policies.
      id-token: write
    steps:
      - name: Require the reviewed public release context
        shell: bash
        env:
          NPM_RELEASE_POLICY_VERSION: ${{ vars.NPM_RELEASE_POLICY_VERSION }}
          RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$NPM_RELEASE_POLICY_VERSION" != "v3-physicalsystems-preview" ]]; then
            echo "::error title=Unprotected release environment::The npm-release environment must provide NPM_RELEASE_POLICY_VERSION=v3-physicalsystems-preview after the physicalsystems trusted publisher allows npm publish"
            exit 1
          fi
          if [[ "$RELEASE_REPOSITORY_PRIVATE" != "false" ]]; then
            echo "::error title=Private repository provenance unavailable::npm publishing is disabled until the source repository is public"
            exit 1
          fi
      - name: Check out the exact reviewed source for legal-file comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
