name: Stage TinyEdge npm preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tinyedge-npm-preview-stage
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.1.3
  PI_RUNTIME_VERSION: 0.84.2-tinyedge.1
  NODE_VERSION: 22.19.0
  # Staged publishing requires npm 11.15.0 or newer. Keep the exact CLI fixed so
  # release behavior cannot change between the build, verification, and stage jobs.
  NPM_VERSION: 11.19.0
  NPM_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RELEASE_ARTIFACT_DIRECTORY: release-artifacts
  RELEASE_ARTIFACT_NAME: tinyedge-npm-0.1.3-${{ github.sha }}

jobs:
  require-main:
    name: Require a manual main-branch dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Refuse release while npm publication approval is pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e NPM-RELEASE-PENDING.md ]]; then
            echo "::error title=npm release pending::NPM-RELEASE-PENDING.md is present; source licensing does not authorize building, staging, or publishing npm release packages"
            exit 1
          fi
      - name: Refuse release while source licensing is pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e LICENSE-PENDING.md ]]; then
            echo "::error title=License pending::LICENSE-PENDING.md is present; this export candidate must not build, stage, or publish release packages"
            exit 1
          fi
      - name: Refuse every repository, event, or ref except TinyEdge main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "TinyEdgeAI/tinyedge-edge"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify the public/private source boundary
        run: node scripts/check-export-boundary.mjs

  build:
    name: Pack the Windows x64 candidate once
    needs: require-main
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.candidate.outputs.name }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.candidate.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false
      - name: Install the pinned staged-publishing npm CLI
        shell: pwsh
        run: |
          npm install --global "npm@$env:NPM_VERSION" --registry="$env:NPM_REGISTRY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualVersion = (npm --version).Trim()
          if ($actualVersion -ne $env:NPM_VERSION) {
            throw "Expected npm $env:NPM_VERSION, received $actualVersion"
          }
      - name: Require the exact package and dependency contract
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'

          const root = process.env.GITHUB_WORKSPACE
          const expectedVersion = process.env.RELEASE_VERSION
          const expectedRuntimeVersion = process.env.PI_RUNTIME_VERSION
          assert.equal(expectedVersion, '0.1.3')
          assert.equal(expectedRuntimeVersion, '0.84.2-tinyedge.1')

          const readPackage = (directory) => JSON.parse(
            readFileSync(path.join(root, directory, 'package.json'), 'utf8'),
          )
          const cli = readPackage('packages/cli')
          const pi = readPackage('packages/pi')
          const facade = readPackage('packages/npx')
          const runtime = readPackage('packages/pi-runtime')

          assert.equal(cli.name, '@tinyedge/cli')
          assert.equal(pi.name, '@tinyedge/pi')
          assert.equal(facade.name, 'tinyedge')
          assert.equal(runtime.name, '@tinyedge/pi-runtime')
          assert.equal(cli.bin, undefined)
          assert.deepEqual(facade.bin, { tinyedge: 'bin/tinyedge.js' })
          assert.equal(runtime.version, expectedRuntimeVersion)
          assert.equal(runtime.license, 'MIT')
          assert.equal(runtime.bin, undefined)
          for (const candidate of [cli, pi, facade]) {
            assert.equal(candidate.version, expectedVersion)
            assert.deepEqual(candidate.os, ['win32'])
            assert.equal(candidate.engines?.node, '>=22.19.0')
            assert.equal(candidate.publishConfig?.access, 'public')
          }
          assert.equal(runtime.engines?.node, '>=22.19.0')
          assert.equal(runtime.repository?.url, 'git+https://github.com/TinyEdgeAI/tinyedge-edge.git')
          assert.equal(cli.dependencies?.['@tinyedge/pi-runtime'], expectedRuntimeVersion)
          assert.equal(pi.dependencies?.['@tinyedge/cli'], expectedVersion)
          assert.equal(pi.peerDependencies?.['@earendil-works/pi-coding-agent'], '0.84.2')
          assert.equal(pi.peerDependenciesMeta?.['@earendil-works/pi-coding-agent']?.optional, true)
          assert.equal(pi.dependencies?.['@earendil-works/pi-coding-agent'], undefined)
          assert.equal(facade.dependencies?.['@tinyedge/cli'], expectedVersion)

          const lock = JSON.parse(
            readFileSync(path.join(root, 'packages/cli/package-lock.json'), 'utf8'),
          )
          assert.equal(lock.version, expectedVersion)
          assert.equal(lock.packages?.['']?.version, expectedVersion)
          assert.equal(lock.packages?.['']?.dependencies?.['@tinyedge/pi-runtime'], expectedRuntimeVersion)
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack the four exact local tarballs and SHA-256 manifest once
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ARTIFACT_DIRECTORY
          npm --prefix packages/cli run release:pack -- $artifactDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap checks from the locally packed runtime
        shell: pwsh
        run: |
          $runtimeTarball = Join-Path $env:GITHUB_WORKSPACE "$env:RELEASE_ARTIFACT_DIRECTORY/tinyedge-pi-runtime-$env:PI_RUNTIME_VERSION.tgz"
          if (-not (Test-Path -LiteralPath $runtimeTarball)) {
            throw "Missing locally packed runtime $runtimeTarball"
          }
          npm --prefix packages/cli install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund $runtimeTarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run package source and SDK checks
        shell: pwsh
        run: |
          npm --prefix packages/pi-runtime test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/cli run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/cli run check:pi-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/cli test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record candidate identity
        id: candidate
        shell: pwsh
        run: |
          "name=$env:RELEASE_ARTIFACT_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $manifestPath = Join-Path $env:RELEASE_ARTIFACT_DIRECTORY 'release-manifest.json'
          $manifestSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "manifest-sha256=$manifestSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "## Packed npm candidate" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Artifact: ``$env:RELEASE_ARTIFACT_NAME``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -Raw $manifestPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload the immutable candidate tarballs and checksum manifest
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify:
    name: Verify the same tarballs on Windows ${{ matrix.architecture }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Install the pinned staged-publishing npm CLI
        shell: pwsh
        run: |
          npm install --global "npm@$env:NPM_VERSION" --registry="$env:NPM_REGISTRY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualVersion = (npm --version).Trim()
          if ($actualVersion -ne $env:NPM_VERSION) {
            throw "Expected npm $env:NPM_VERSION, received $actualVersion"
          }
          if ("$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)".ToLowerInvariant() -ne '${{ matrix.architecture }}') {
            throw "Expected the ${{ matrix.architecture }} runner architecture"
          }
          $actualNodeArchitecture = (node -p 'process.arch').Trim()
          if ($actualNodeArchitecture -ne '${{ matrix.architecture }}') {
            throw "Expected a ${{ matrix.architecture }} Node.js runtime, received $actualNodeArchitecture"
          }
      - name: Download the build job's exact tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
      - name: Verify checksums, lifecycle installs, command shims, Harness dispatch, Pi, and native bindings
        shell: pwsh
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ARTIFACT_DIRECTORY
          $manifestPath = Join-Path $artifactDirectory 'release-manifest.json'
          $actualManifestSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualManifestSha256 -ne $env:EXPECTED_MANIFEST_SHA256) {
            throw "Downloaded release manifest digest $actualManifestSha256 does not match trusted build output $env:EXPECTED_MANIFEST_SHA256"
          }
          npm --prefix packages/cli run release:verify -- $artifactDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record architecture verification evidence
        shell: pwsh
        env:
          SOURCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ARTIFACT_DIRECTORY
          $evidenceDirectory = Join-Path $env:GITHUB_WORKSPACE 'verification-evidence'
          New-Item -ItemType Directory -Path $evidenceDirectory | Out-Null
          $tarballs = Get-ChildItem -LiteralPath $artifactDirectory -Filter '*.tgz' | Sort-Object Name | ForEach-Object {
            [ordered]@{
              filename = $_.Name
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $evidence = [ordered]@{
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            runner = '${{ matrix.runner }}'
            architecture = '${{ matrix.architecture }}'
            osArchitecture = "$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)".ToLowerInvariant()
            processArchitecture = (node -p 'process.arch').Trim()
            node = (node --version).Trim()
            npm = (npm --version).Trim()
            sourceArtifactDigest = $env:SOURCE_ARTIFACT_DIGEST
            manifestSha256 = (Get-FileHash -LiteralPath (Join-Path $artifactDirectory 'release-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            tarballs = @($tarballs)
          }
          $evidencePath = Join-Path $evidenceDirectory "verification-${{ matrix.architecture }}.json"
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          "## Windows ${{ matrix.architecture }} verification" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -Raw $evidencePath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload architecture verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinyedge-npm-verification-${{ matrix.architecture }}-${{ github.sha }}
          path: verification-evidence/verification-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage 0.1.3 under preview with npm OIDC
    needs:
      - build
      - verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the reviewed public release context
        shell: bash
        env:
          NPM_RELEASE_POLICY_VERSION: ${{ vars.NPM_RELEASE_POLICY_VERSION }}
          RELEASE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$NPM_RELEASE_POLICY_VERSION" != "v1" ]]; then
            echo "::error title=Unprotected release environment::The npm-release environment must provide NPM_RELEASE_POLICY_VERSION=v1"
            exit 1
          fi
          if [[ "$RELEASE_REPOSITORY_PRIVATE" != "false" ]]; then
            echo "::error title=Private repository provenance unavailable::npm staging is disabled until the source repository is public"
            exit 1
          fi
      - name: Check out the exact reviewed source for legal-file comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Recheck live public GitHub visibility before requesting npm OIDC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'

          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`,
            {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            },
          )
          assert.equal(response.ok, true, `GitHub visibility lookup failed with ${response.status}`)
          const repository = await response.json()
          assert.equal(repository.full_name, 'TinyEdgeAI/tinyedge-edge')
          assert.equal(repository.private, false, 'the release repository must still be public')
          assert.equal(repository.visibility, 'public', 'the release repository must still be public')
          NODE
      - name: Install the pinned staged-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --registry="$NPM_REGISTRY"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Download the x64-built candidate after both Windows verifications
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
      - name: Recheck the exact manifest and every tarball checksum
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'

          const directory = path.resolve(process.env.RELEASE_ARTIFACT_DIRECTORY)
          const manifestBytes = readFileSync(path.join(directory, 'release-manifest.json'))
          assert.equal(
            createHash('sha256').update(manifestBytes).digest('hex'),
            process.env.EXPECTED_MANIFEST_SHA256,
            'downloaded release manifest must match the trusted build-job digest',
          )
          const manifest = JSON.parse(manifestBytes.toString('utf8'))
          const expected = [
            ['pi-runtime', '@tinyedge/pi-runtime', process.env.PI_RUNTIME_VERSION, 'tinyedge-pi-runtime-0.84.2-tinyedge.1.tgz'],
            ['cli', '@tinyedge/cli', process.env.RELEASE_VERSION, 'tinyedge-cli-0.1.3.tgz'],
            ['pi', '@tinyedge/pi', process.env.RELEASE_VERSION, 'tinyedge-pi-0.1.3.tgz'],
            ['facade', 'tinyedge', process.env.RELEASE_VERSION, 'tinyedge-0.1.3.tgz'],
          ]

          assert.equal(process.env.RELEASE_VERSION, '0.1.3')
          assert.equal(process.env.PI_RUNTIME_VERSION, '0.84.2-tinyedge.1')
          assert.equal(manifest.schemaVersion, 1)
          assert.equal(manifest.version, process.env.RELEASE_VERSION)
          assert.equal(manifest.commit, process.env.GITHUB_SHA)
          assert.equal(manifest.artifacts.length, expected.length)
          for (let index = 0; index < expected.length; index += 1) {
            const [key, name, version, filename] = expected[index]
            const artifact = manifest.artifacts[index]
            assert.equal(artifact.key, key)
            assert.equal(artifact.name, name)
            assert.equal(artifact.version, version)
            assert.equal(artifact.filename, filename)
            const digest = createHash('sha256')
              .update(readFileSync(path.join(directory, filename)))
              .digest('hex')
            assert.equal(digest, artifact.sha256)
            const integrity = `sha512-${createHash('sha512')
              .update(readFileSync(path.join(directory, filename)))
              .digest('base64')}`
            assert.equal(integrity, artifact.integrity)
          }
          NODE
      - name: Refuse unresolved package licenses before staging
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'

          const directory = path.resolve(process.env.RELEASE_ARTIFACT_DIRECTORY)
          const expected = [
            {
              name: '@tinyedge/pi-runtime',
              version: process.env.PI_RUNTIME_VERSION,
              filename: 'tinyedge-pi-runtime-0.84.2-tinyedge.1.tgz',
              sourceDirectory: 'packages/pi-runtime',
              license: 'MIT',
              legalFiles: ['LICENSE', 'NOTICE', 'SBOM.cdx.json', 'UPSTREAM.md', 'THIRD_PARTY_NOTICES.md', 'UPSTREAM_README.md'],
            },
            ...[
              ['@tinyedge/cli', 'tinyedge-cli-0.1.3.tgz', 'packages/cli'],
              ['@tinyedge/pi', 'tinyedge-pi-0.1.3.tgz', 'packages/pi'],
              ['tinyedge', 'tinyedge-0.1.3.tgz', 'packages/npx'],
            ].map(([name, filename, sourceDirectory]) => ({
              name,
              version: process.env.RELEASE_VERSION,
              filename,
              sourceDirectory,
              license: 'Apache-2.0',
              legalFiles: ['LICENSE', 'NOTICE', 'SBOM.cdx.json', 'THIRD_PARTY_NOTICES.md'],
            })),
          ]

          for (const { name, version, filename, sourceDirectory, license, legalFiles } of expected) {
            const packedPackage = JSON.parse(execFileSync(
              'tar',
              ['-xOf', path.join(directory, filename), 'package/package.json'],
              { encoding: 'utf8' },
            ))
            assert.equal(packedPackage.name, name)
            assert.equal(packedPackage.version, version)
            assert.notEqual(packedPackage.private, true, `${name} must be publishable before staging`)
            assert.deepEqual(
              packedPackage.publishConfig,
              { access: 'public' },
              `${name} publishConfig must not redirect registry or authentication`,
            )
            assert.equal(
              packedPackage.license,
              license,
              `${name} must use its approved release license`,
            )
            const packedFiles = execFileSync(
              'tar',
              ['-tf', path.join(directory, filename)],
              { encoding: 'utf8' },
            ).split(/\r?\n/)
            for (const legalFile of legalFiles) {
              assert.ok(
                packedFiles.includes(`package/${legalFile}`),
                `${name} must carry ${legalFile}`,
              )
              assert.deepEqual(
                execFileSync('tar', [
                  '-xOf',
                  path.join(directory, filename),
                  `package/${legalFile}`,
                ]),
                readFileSync(path.join(sourceDirectory, legalFile)),
                `${name} packed ${legalFile} must match the reviewed source bytes`,
              )
            }
            if (name === '@tinyedge/pi-runtime') {
              for (const [peer, peerVersion] of [
                ['@mariozechner/clipboard', '0.3.9'],
                ['@silvia-odwyer/photon-node', '0.3.4'],
              ]) {
                assert.equal(packedPackage.peerDependencies?.[peer], peerVersion)
                assert.equal(packedPackage.peerDependenciesMeta?.[peer]?.optional, true)
                assert.equal(packedPackage.dependencies?.[peer], undefined)
                assert.equal(packedPackage.optionalDependencies?.[peer], undefined)
              }
              assert.deepEqual(Object.keys(packedPackage.devDependencies || {}), [])
              assert.equal(
                packedFiles.find((file) => /(^|\/)examples\//i.test(file)
                  || /\.(?:map|wasm|node|dll|exe|so|dylib|ttf|otf|woff2?|png|jpe?g|gif|webp|svg)$/i.test(file)),
                undefined,
              )
              const runtimeShrinkwrap = JSON.parse(execFileSync(
                'tar',
                ['-xOf', path.join(directory, filename), 'package/npm-shrinkwrap.json'],
                { encoding: 'utf8' },
              ))
              for (const packagePath of Object.keys(runtimeShrinkwrap.packages || {})) {
                assert.doesNotMatch(
                  packagePath,
                  /@earendil-works\/pi-coding-agent|@mariozechner\/clipboard|@silvia-odwyer\/photon-node/,
                )
              }
            }
          }

          const runtimeTarball = path.join(directory, 'tinyedge-pi-runtime-0.84.2-tinyedge.1.tgz')
          const normalize = (value) => value.replace(/\r\n?/g, '\n').trim()
          const expectedLicense = `MIT License

          Copyright (c) 2025 Mario Zechner

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.`.split('\n').map((line) => line.trimStart()).join('\n')
          const packedLicense = execFileSync(
            'tar',
            ['-xOf', runtimeTarball, 'package/LICENSE'],
            { encoding: 'utf8' },
          )
          assert.equal(normalize(packedLicense), expectedLicense)
          const packedUpstream = execFileSync(
            'tar',
            ['-xOf', runtimeTarball, 'package/UPSTREAM.md'],
            { encoding: 'utf8' },
          )
          for (const exactProvenance of [
            '@earendil-works/pi-coding-agent@0.84.2',
            'https://github.com/earendil-works/pi',
            '914cf1472e715297caa30db4b9535d534a9eb718',
            'sha512-l4E+B7hgXKWddRo8bC/eSue2aWZjEgJ9xIpf5p0Og+lq8a2TArCwJ0HCoCPCgaBP/tN4zbYH/wOwvx9pJpeLCA==',
            'e4d4c1e769963c816959f5cea02a0a10ccc0495a',
          ]) {
            assert.ok(packedUpstream.includes(exactProvenance))
          }
          const manifest = JSON.parse(
            execFileSync(
              'tar',
              ['-xOf', path.join(directory, 'tinyedge-cli-0.1.3.tgz'), 'package/npm-shrinkwrap.json'],
              { encoding: 'utf8' },
            ),
          )
          const releaseManifest = JSON.parse(readFileSync(
            path.join(directory, 'release-manifest.json'),
            'utf8',
          ))
          const runtimeArtifact = releaseManifest.artifacts.find(({ key }) => key === 'pi-runtime')
          const lockedRuntime = manifest.packages?.['node_modules/@tinyedge/pi-runtime']
          assert.equal(
            lockedRuntime?.resolved,
            'https://registry.npmjs.org/@tinyedge/pi-runtime/-/pi-runtime-0.84.2-tinyedge.1.tgz',
          )
          assert.equal(lockedRuntime?.integrity, runtimeArtifact.integrity)
          NODE
      - name: Require the runtime bootstrap, published runtime, and unpublished TinyEdge candidates
        shell: bash
        env:
          PI_RUNTIME_BOOTSTRAP_INTEGRITY: ${{ vars.PI_RUNTIME_BOOTSTRAP_INTEGRITY }}
          PI_RUNTIME_BOOTSTRAP_SHASUM: ${{ vars.PI_RUNTIME_BOOTSTRAP_SHASUM }}
        run: |
          set -euo pipefail
          mkdir -p stage-evidence
          if ! runtime_metadata="$(npm view '@tinyedge/pi-runtime@0.0.0' name version license publishConfig bin dependencies optionalDependencies peerDependencies peerDependenciesMeta devDependencies bundledDependencies bundleDependencies scripts dist --json --registry="$NPM_REGISTRY" 2>&1)"; then
            printf '%s\n' "$runtime_metadata" | tee stage-evidence/pi-runtime-bootstrap-check.log
            echo "::error title=Runtime package does not exist::npm staged publishing cannot create a brand-new package; publish the separately approved no-code @tinyedge/pi-runtime@0.0.0 bootstrap interactively with 2FA under the bootstrap tag first"
            exit 1
          fi
          runtime_tags="$(npm view '@tinyedge/pi-runtime' dist-tags --json --registry="$NPM_REGISTRY" 2>&1)"
          mkdir -p stage-evidence/pi-runtime-bootstrap
          runtime_pack="$(npm pack '@tinyedge/pi-runtime@0.0.0' --json --ignore-scripts --registry="$NPM_REGISTRY" --pack-destination stage-evidence/pi-runtime-bootstrap 2>&1)"
          {
            printf 'metadata=%s\n' "$runtime_metadata"
            printf 'dist-tags=%s\n' "$runtime_tags"
            printf 'pack=%s\n' "$runtime_pack"
          } | tee stage-evidence/pi-runtime-bootstrap-check.log
          RUNTIME_METADATA_JSON="$runtime_metadata" RUNTIME_TAGS_JSON="$runtime_tags" RUNTIME_PACK_JSON="$runtime_pack" \
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import path from 'node:path'

          assert.match(process.env.PI_RUNTIME_BOOTSTRAP_INTEGRITY || '', /^sha512-[A-Za-z0-9+/]+={0,2}$/)
          assert.match(process.env.PI_RUNTIME_BOOTSTRAP_SHASUM || '', /^[0-9a-f]{40}$/)
          const metadata = JSON.parse(process.env.RUNTIME_METADATA_JSON)
          const assertInertBootstrap = (manifest, source) => {
            assert.equal(manifest.name, '@tinyedge/pi-runtime', `${source} package name`)
            assert.equal(manifest.version, '0.0.0', `${source} package version`)
            assert.equal(manifest.license, 'MIT', `${source} package license`)
            assert.deepEqual(manifest.publishConfig, { access: 'public' })
            for (const field of [
              'bin',
              'dependencies',
              'optionalDependencies',
              'peerDependencies',
              'peerDependenciesMeta',
              'devDependencies',
              'bundledDependencies',
              'bundleDependencies',
              'scripts',
            ]) {
              assert.equal(manifest[field], undefined, `${source} bootstrap must not declare ${field}`)
            }
          }
          assertInertBootstrap(metadata, 'registry metadata')
          assert.equal(metadata.dist?.integrity, process.env.PI_RUNTIME_BOOTSTRAP_INTEGRITY)
          assert.equal(metadata.dist?.shasum, process.env.PI_RUNTIME_BOOTSTRAP_SHASUM)
          assert.equal(
            metadata.dist?.tarball,
            'https://registry.npmjs.org/@tinyedge/pi-runtime/-/pi-runtime-0.0.0.tgz',
          )
          const tags = JSON.parse(process.env.RUNTIME_TAGS_JSON)
          assert.equal(
            tags.bootstrap,
            '0.0.0',
            'the separately reviewed no-code bootstrap must remain under the bootstrap tag',
          )
          assert.equal(
            tags.latest,
            process.env.PI_RUNTIME_VERSION,
            'after the audited runtime promotion, npm latest must resolve to the published compatibility runtime',
          )
          assert.equal(
            tags.preview,
            process.env.PI_RUNTIME_VERSION,
            'after the audited runtime promotion, npm preview must resolve to the published compatibility runtime',
          )
          const [packed] = JSON.parse(process.env.RUNTIME_PACK_JSON)
          assert.equal(packed.name, '@tinyedge/pi-runtime')
          assert.equal(packed.version, '0.0.0')
          assert.equal(packed.integrity, process.env.PI_RUNTIME_BOOTSTRAP_INTEGRITY)
          assert.equal(packed.shasum, process.env.PI_RUNTIME_BOOTSTRAP_SHASUM)
          assert.deepEqual(
            packed.files.map(({ path }) => path).sort(),
            ['LICENSE', 'README.md', 'package.json'],
            'the namespace bootstrap must contain only its license, explanation, and inert manifest',
          )
          assert.deepEqual(packed.bundled || [], [])
          const packedManifest = JSON.parse(execFileSync(
            'tar',
            [
              '-xOf',
              path.resolve('stage-evidence/pi-runtime-bootstrap/tinyedge-pi-runtime-0.0.0.tgz'),
              'package/package.json',
            ],
            { encoding: 'utf8' },
          ))
          assertInertBootstrap(packedManifest, 'downloaded tarball')
          NODE
          check_unpublished() {
            local package="$1"
            local version="$2"
            local slug="$3"
            local output
            if output="$(npm view "${package}@${version}" version --json --registry="$NPM_REGISTRY" 2>&1)"; then
              printf '%s\n' "$output" | tee "stage-evidence/${slug}-published-check.log"
              echo "::error title=Version already published::${package}@${version} already exists"
              return 1
            fi
            printf '%s\n' "$output" | tee "stage-evidence/${slug}-published-check.log"
            if ! grep -q 'E404' <<<"$output"; then
              echo "::error title=Registry preflight failed::Could not prove ${package}@${version} is unpublished"
              return 1
            fi
          }
          check_unpublished '@tinyedge/cli' "$RELEASE_VERSION" cli
          check_unpublished '@tinyedge/pi' "$RELEASE_VERSION" pi
          check_unpublished 'tinyedge' "$RELEASE_VERSION" facade
          if ! published_runtime="$(npm view "@tinyedge/pi-runtime@$PI_RUNTIME_VERSION" name version dist --json --registry="$NPM_REGISTRY" 2>&1)"; then
            printf '%s\n' "$published_runtime" | tee stage-evidence/pi-runtime-published-check.log
            echo "::error title=Audited runtime missing::@tinyedge/pi-runtime@$PI_RUNTIME_VERSION must already be published; this release reuses it and must not restage it"
            exit 1
          fi
          printf '%s\n' "$published_runtime" | tee stage-evidence/pi-runtime-published-check.log
          PUBLISHED_RUNTIME_JSON="$published_runtime" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'

          const published = JSON.parse(process.env.PUBLISHED_RUNTIME_JSON)
          assert.equal(published.name, '@tinyedge/pi-runtime')
          assert.equal(published.version, process.env.PI_RUNTIME_VERSION)
          const packed = readFileSync(path.join(
            process.env.RELEASE_ARTIFACT_DIRECTORY,
            `tinyedge-pi-runtime-${process.env.PI_RUNTIME_VERSION}.tgz`,
          ))
          const integrity = `sha512-${createHash('sha512').update(packed).digest('base64')}`
          assert.equal(
            published.dist?.integrity,
            integrity,
            'packed runtime tarball must match the already-published registry artifact',
          )
          NODE
      - name: Stage @tinyedge/cli@0.1.3 under preview
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish "./$RELEASE_ARTIFACT_DIRECTORY/tinyedge-cli-0.1.3.tgz" --registry="$NPM_REGISTRY" --provenance --tag preview --access public 2>&1 \
            | tee stage-evidence/cli-stage.log
      - name: Stage @tinyedge/pi@0.1.3 under preview
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish "./$RELEASE_ARTIFACT_DIRECTORY/tinyedge-pi-0.1.3.tgz" --registry="$NPM_REGISTRY" --provenance --tag preview --access public 2>&1 \
            | tee stage-evidence/pi-stage.log
      - name: Stage tinyedge@0.1.3 under preview
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish "./$RELEASE_ARTIFACT_DIRECTORY/tinyedge-0.1.3.tgz" --registry="$NPM_REGISTRY" --provenance --tag preview --access public 2>&1 \
            | tee stage-evidence/facade-stage.log
      - name: Record staging evidence and the human approval boundary
        if: always()
        shell: bash
        env:
          SOURCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          mkdir -p stage-evidence
          if [[ -f "$RELEASE_ARTIFACT_DIRECTORY/release-manifest.json" ]]; then
            cp "$RELEASE_ARTIFACT_DIRECTORY/release-manifest.json" stage-evidence/release-manifest.json
          fi
          {
            echo "## npm staged-preview evidence"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Candidate artifact: \`${{ needs.build.outputs.artifact-name }}\`"
            echo "- GitHub artifact digest: \`$SOURCE_ARTIFACT_DIGEST\`"
            echo "- Destination tag: \`preview\`"
            echo "- No package is public until a maintainer inspects and approves each npm stage with 2FA."
            echo "- @tinyedge/pi-runtime@$PI_RUNTIME_VERSION is already published; this workflow packs it for verification, matches the packed tarball to the live registry artifact, and does not restage it. The inert 0.0.0 bootstrap remains under the bootstrap tag. This workflow never direct-publishes the runtime."
            echo "- Automatic provenance applies to these staged candidate artifacts from the public repository, not to the earlier interactive bootstrap publication."
            echo "- Staging requires a protected-environment policy sentinel and a public repository eligible for npm's automatic provenance attestation."
          } | tee stage-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload registry preflight and staging logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinyedge-npm-stage-evidence-${{ github.sha }}
          path: stage-evidence
          if-no-files-found: error
          retention-days: 30
