          assert.equal(
            published.dist?.attestations?.provenance?.predicateType,
            'https://slsa.dev/provenance/v1',
            'the registry must expose an SLSA v1 provenance predicate',
          )
          assert.equal(tags.latest, '0.0.0', 'publishing preview must not move the inert initial latest tag')
          assert.equal(tags.bootstrap, '0.0.0', 'the inert namespace bootstrap must remain isolated')
          assert.equal(tags.preview, process.env.RELEASE_VERSION, 'preview must resolve to 0.2.1')
          NODE
          mkdir -p publish-evidence/signature-audit
          (
            cd publish-evidence/signature-audit
            npm init --yes >/dev/null
          )
          published_metadata=
          published_tags=
          verification_succeeded=false
          for attempt in {1..12}; do
            if published_metadata="$(npm view "physicalsystems@$RELEASE_VERSION" name version dist --json --registry="$NPM_REGISTRY" 2>&1)" \
              && published_tags="$(npm view physicalsystems dist-tags --json --registry="$NPM_REGISTRY" 2>&1)" \
              && PUBLISHED_PHYSICALSYSTEMS_JSON="$published_metadata" PUBLISHED_PHYSICALSYSTEMS_TAGS_JSON="$published_tags" \
                node publish-evidence/verify-published-physicalsystems.mjs 2>>publish-evidence/registry-convergence.log; then
              printf '%s\n' "$published_metadata" > publish-evidence/physicalsystems-registry-after.json
              printf '%s\n' "$published_tags" > publish-evidence/physicalsystems-dist-tags-after.json
              if (
                cd publish-evidence/signature-audit
                rm -rf node_modules package-lock.json
                npm install --ignore-scripts --no-audit --no-fund \
                  "physicalsystems@$RELEASE_VERSION" --registry="$NPM_REGISTRY" 2>&1 \
                  | tee "../physicalsystems-install-attempt-${attempt}.log" &&
                npm audit signatures --registry="$NPM_REGISTRY" 2>&1 \
                  | tee "../physicalsystems-signature-audit-attempt-${attempt}.log"
              ); then
                verification_succeeded=true
                break
              fi
            fi
            {
              printf 'attempt=%s\n' "$attempt"
              printf 'metadata=%s\n' "$published_metadata"
              printf 'dist-tags=%s\n' "$published_tags"
            } >> publish-evidence/registry-convergence.log
            sleep 10
          done
          if [[ "$verification_succeeded" != "true" ]]; then
            echo "::error title=Registry convergence failed::Could not verify registry bytes, dist-tags, provenance metadata, and cryptographic signatures after 12 attempts"
            exit 1
          fi
      - name: Record publication evidence and the protected approval boundary
        if: always()
        shell: bash
        env:
          SOURCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          mkdir -p publish-evidence
          if [[ -f "$RELEASE_ARTIFACT_DIRECTORY/release-manifest.json" ]]; then
            cp "$RELEASE_ARTIFACT_DIRECTORY/release-manifest.json" publish-evidence/release-manifest.json
          fi
          {
            echo "## npm direct-preview evidence"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Candidate artifact: \`${{ needs.build.outputs.artifact-name }}\`"
            echo "- GitHub artifact digest: \`$SOURCE_ARTIFACT_DIGEST\`"
            echo "- Destination tag: \`preview\`"
            echo "- The protected npm-release environment is the single pre-publication approval gate."
            echo "- Registry integrity, dist-tags, SLSA provenance metadata, and npm's cryptographic signature audit were rechecked after publication."
            echo "- @tinyedge/pi-runtime@$PI_RUNTIME_VERSION is already published; this workflow packs it for verification, matches the packed tarball to the live registry artifact, and never republishes it."
            echo "- @tinyedge/cli@0.1.3 and @tinyedge/pi@0.1.3 remain immutable compatibility releases and are not part of this candidate."
            echo "- Automatic provenance applies to physicalsystems@0.2.1 from this public repository, not to either earlier inert namespace bootstrap publication."
            echo "- Promotion from preview to latest remains a separate manual maintainer action with npm 2FA."
          } | tee publish-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload registry preflight and publication logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physicalsystems-npm-publish-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: publish-evidence
          if-no-files-found: error
          retention-days: 30
