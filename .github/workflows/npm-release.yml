      - name: Recheck public visibility and protected release-environment rules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          }
          const get = async (pathname, description) => {
            const response = await fetch(`${process.env.GITHUB_API_URL}${pathname}`, { headers })
            assert.equal(response.ok, true, `${description} failed with ${response.status}`)
            return response.json()
          }
          const repositoryPath = `/repos/${process.env.GITHUB_REPOSITORY}`
          const repository = await get(repositoryPath, 'GitHub visibility lookup')
          assert.equal(repository.full_name, 'PhysicalSystems/physicalsystems')
          assert.equal(repository.private, false, 'the release repository must still be public')
          assert.equal(repository.visibility, 'public', 'the release repository must still be public')

          const environment = await get(
            `${repositoryPath}/environments/npm-release`,
            'npm-release environment lookup',
          )
          assert.equal(
            environment.can_admins_bypass,
            false,
            'npm-release must disable administrator protection-rule bypass',
          )
          const reviewerRule = environment.protection_rules?.find(
            ({ type }) => type === 'required_reviewers',
          )
          assert.ok(
            reviewerRule?.reviewers?.length >= 1,
            'npm-release must require at least one human reviewer',
          )
          assert.equal(
            environment.deployment_branch_policy?.custom_branch_policies,
            true,
            'npm-release must use selected deployment branches',
          )
          assert.equal(
            environment.deployment_branch_policy?.protected_branches,
            false,
            'npm-release must not inherit a broader protected-branches policy',
          )
          const policies = await get(
            `${repositoryPath}/environments/npm-release/deployment-branch-policies?per_page=100`,
            'npm-release deployment-branch policy lookup',
          )
          assert.equal(
            policies.total_count,
            1,
            'npm-release must allow exactly one deployment ref',
          )
          assert.deepEqual(
            policies.branch_policies?.map(({ name, type }) => ({ name, type })),
            [{ name: 'main', type: 'branch' }],
            'npm-release must allow only the exact main branch and no tags',
          )
          NODE
