          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'
          import { assertProductArchiveSize } from './packages/cli/scripts/product-size-policy.js'

          const directory = path.resolve(process.env.RELEASE_ARTIFACT_DIRECTORY)
          const manifestBytes = readFileSync(path.join(directory, 'release-manifest.json'))
          assert.equal(
            createHash('sha256').update(manifestBytes).digest('hex'),
            process.env.EXPECTED_MANIFEST_SHA256,
            'downloaded release manifest must match the trusted build-job digest',
          )
          const manifest = JSON.parse(manifestBytes.toString('utf8'))
          const expected = [
            ['pi-runtime', '@tinyedge/pi-runtime', process.env.PI_RUNTIME_VERSION, 'tinyedge-pi-runtime-0.84.2-tinyedge.1.tgz'],
            ['physicalsystems', 'physicalsystems', process.env.RELEASE_VERSION, 'physicalsystems-0.2.1.tgz'],
          ]

          assert.equal(process.env.RELEASE_VERSION, '0.2.1')
          assert.equal(process.env.PI_RUNTIME_VERSION, '0.84.2-tinyedge.1')
          assert.equal(manifest.schemaVersion, 1)
          assert.equal(manifest.version, process.env.RELEASE_VERSION)
          assert.equal(manifest.commit, process.env.GITHUB_SHA)
          assert.equal(manifest.artifacts.length, expected.length)
          for (let index = 0; index < expected.length; index += 1) {
            const [key, name, version, filename] = expected[index]
            const artifact = manifest.artifacts[index]
            assert.equal(artifact.key, key)
            assert.equal(artifact.name, name)
            assert.equal(artifact.version, version)
            assert.equal(artifact.filename, filename)
            const bytes = readFileSync(path.join(directory, filename))
            if (key === 'physicalsystems') assertProductArchiveSize(bytes.length)
            assert.equal(bytes.length, artifact.size, 'archive byte count must match the approved manifest')
            const digest = createHash('sha256')
              .update(bytes)
              .digest('hex')
            assert.equal(digest, artifact.sha256)
            const integrity = `sha512-${createHash('sha512')
              .update(bytes)
              .digest('base64')}`
            assert.equal(integrity, artifact.integrity)
          }
