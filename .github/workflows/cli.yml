name: Physical Systems CLI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: physicalsystems-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: Build one review candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: node scripts/check-export-boundary.mjs
      - name: Pin the reviewed npm release runtime
        shell: pwsh
        run: |
          npm install --global "npm@11.19.0"
          if ((npm --version) -ne '11.19.0') { throw 'Expected npm 11.19.0' }
      - name: Prepare the complete npm product once
        shell: pwsh
        run: |
          $productDirectory = Join-Path $env:RUNNER_TEMP 'physicalsystems-product'
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'candidate-artifacts'
          npm run release:prepare -- --output $productDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $artifactDirectory) { throw 'Candidate output already exists' }
          Copy-Item -LiteralPath (Join-Path $productDirectory 'candidate') -Destination $artifactDirectory -Recurse
      - run: npm run check:legal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physicalsystems-0.2.1-ubuntu-canary-${{ github.sha }}
          path: candidate-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  test:
    # Every supported desktop route exercises a packed npm artifact.
    # Linux additionally proves fail-closed Secret Service storage and a real
    # interactive Harness render/input/exit cycle through a pseudo-terminal.
    # Keep the three established required-check contexts stable. Ubuntu 22.04
    # is additive; the established Linux context remains the Ubuntu 24.04 job.
    name: test (${{ matrix.check_name }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            check_name: windows x64
            platform: windows
            runner: windows-latest
            python: '3.12'
          - architecture: arm64
            check_name: windows arm64
            platform: windows
            runner: windows-11-arm
          - architecture: x64
            check_name: ubuntu-22.04 x64
            platform: linux
            runner: ubuntu-22.04
            python: '3.10'
          - architecture: x64
            check_name: linux x64
            platform: linux
            runner: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Select the unsupported Node regression runtime
        if: matrix.check_name == 'linux x64'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 12.22.9
          architecture: x64
          package-manager-cache: false
      - name: Require one actionable failure before modern application code loads
        if: matrix.check_name == 'linux x64'
        run: node packages/cli/scripts/check-unsupported-node.cjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          architecture: ${{ matrix.architecture }}
          cache: npm
          cache-dependency-path: |
            packages/cli/package-lock.json
            packages/cli/npm-shrinkwrap.json
            packages/pi-runtime/npm-shrinkwrap.json
      - run: node -e "if (process.arch !== '${{ matrix.architecture }}') throw new Error('Expected ${{ matrix.architecture }}, received ' + process.arch)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.architecture == 'x64'
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - run: node scripts/check-export-boundary.mjs
      - name: Pin the reviewed npm release runtime
        shell: pwsh
        run: |
          npm install --global "npm@11.19.0"
          if ((npm --version) -ne '11.19.0') { throw 'Expected npm 11.19.0' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: physicalsystems-0.2.1-ubuntu-canary-${{ github.sha }}
          path: candidate-artifacts
      - name: Reuse the candidate dependency closure for platform source tests
        run: node scripts/hydrate-review-dependencies.mjs candidate-artifacts ${{ github.sha }}
      - name: Exercise Linux Secret Service adapter
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools xdg-utils
          command -v secret-tool
          command -v xdg-open
          runtime_directory="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$runtime_directory"
          trap 'rm -rf "$runtime_directory"' EXIT
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "%s" "tinyedge-ephemeral-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            TINYEDGE_LINUX_SECRET_SERVICE_CANARY=1 node --test packages/cli/test/linux-secret-service-canary.test.js
          '
      - run: npm run check:legal
      - run: npm --prefix packages/cli run check:pi-sdk
      - run: npm --prefix packages/cli run check
      - run: npm --prefix packages/cli test
      - run: node --test test/npm-release-workflow.test.mjs
      - run: npm --prefix packages/cli run release:verify -- ${{ github.workspace }}/candidate-artifacts --require-node-bundle
        if: matrix.platform == 'windows'
      - name: Verify the packed Linux package and interactive Harness
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          runtime_directory="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$runtime_directory"
          trap 'rm -rf "$runtime_directory"' EXIT
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "%s" "tinyedge-ephemeral-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            npm --prefix packages/cli run release:verify -- "$GITHUB_WORKSPACE/candidate-artifacts" --require-node-bundle
          '
