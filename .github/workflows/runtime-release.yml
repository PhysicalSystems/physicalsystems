name: Qualify or publish public Runtime
run-name: Runtime ${{ inputs.operation }} ${{ inputs.coordinator_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify the approved published bytes without uploading, or publish a separately reviewed new candidate'
        type: choice
        options: [verify-published, publish]
        default: verify-published
        required: true
      candidate_release_id:
        description: 'Publish only: public runtime-v<version>-candidate release ID with wheel, sdist and release.json'
        type: string
        required: false
      release_metadata_sha256:
        description: 'Publish only: operator-reviewed raw SHA-256 of release.json'
        type: string
        required: false
      coordinator_id:
        description: 'Optional release coordinator UUID; leave empty for a direct manual run'
        type: string
        required: false
      expected_head_sha:
        description: 'Optional exact reviewed main SHA; required when dispatched by the coordinator'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: physicalsystems-runtime-pypi
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  OPERATION: ${{ inputs.operation }}
  RELEASE_ID: ${{ inputs.candidate_release_id }}
  METADATA_SHA256: ${{ inputs.release_metadata_sha256 }}
  COORDINATOR_ID: ${{ inputs.coordinator_id }}
  EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}

jobs:
  verify:
    if: ${{ github.repository == 'PhysicalSystems/physicalsystems' && github.ref == 'refs/heads/main' && github.event.repository.private == false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -B -m pip --isolated install --index-url https://pypi.org/simple pytest==8.4.2 twine==6.2.0
      - run: python -B -m pytest -q -p no:cacheprovider release/runtime/tests
      - name: Audit exact current-main dispatch and protected human-review policy, without OIDC
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, '-B', 'release/publisher-verification.py', '--component', 'runtime',
              '--audit-only', '--output', str(Path(os.environ['RUNNER_TEMP']) / 'runtime-preflight-audit.json')], check=True)
      - name: Check the approved published wheel or exact new candidate without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, '-B', 'release/runtime/scripts/release.py', 'fetch',
              '--operation', os.environ['OPERATION'], '--candidate-release-id', os.environ['RELEASE_ID'],
              '--release-metadata-sha256', os.environ['METADATA_SHA256'],
              '--output', str(Path(os.environ['RUNNER_TEMP']) / 'runtime-input')], check=True, timeout=420)
      - name: Check distribution metadata without importing the candidate
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'runtime-input'
          artifacts = sorted([*source.glob('*.whl'), *source.glob('*.tar.gz')])
          subprocess.run([sys.executable, '-B', '-m', 'twine', 'check', *map(str, artifacts)], check=True)

  install:
    needs: verify
    name: install-${{ matrix.platform }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, win32-x64]
        python: ['3.10', '3.11', '3.12']
        include:
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: win32-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m pip --isolated install --index-url https://pypi.org/simple pytest==8.4.2 jsonschema==4.25.1
      - name: Recheck policy and fetch the exact qualified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          subprocess.run([sys.executable, '-B', 'release/publisher-verification.py', '--component', 'runtime',
              '--audit-only', '--output', str(temporary / 'runtime-install-audit.json')], check=True)
          subprocess.run([sys.executable, '-B', 'release/runtime/scripts/release.py', 'fetch',
              '--operation', os.environ['OPERATION'], '--candidate-release-id', os.environ['RELEASE_ID'],
              '--release-metadata-sha256', os.environ['METADATA_SHA256'],
              '--output', str(temporary / 'runtime-input')], check=True, timeout=420)
      - name: Install only the checked wheel; test all Runtime contracts and golden conformance, without hardware
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_PYTHON: ${{ matrix.python }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          subprocess.run([sys.executable, '-B', 'release/runtime/scripts/release.py', 'install',
              '--directory', str(temporary / 'runtime-input'), '--platform', os.environ['TARGET_PLATFORM'],
              '--python', os.environ['TARGET_PYTHON'], '--output', str(temporary / 'runtime-proof')], check=True, timeout=720)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/runtime-proof/runtime-proof-*.json
          if-no-files-found: error
          retention-days: 90

  finish:
    needs: [verify, install]
    if: ${{ github.repository == 'PhysicalSystems/physicalsystems' && github.ref == 'refs/heads/main' && github.event.repository.private == false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: runtime-pypi
      url: https://pypi.org/project/tinyedge-runtime/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/runtime-proofs
          merge-multiple: true
      - name: Verify environment-scoped PyPI publisher registration after human approval, without uploading
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, runpy, subprocess, sys
          from pathlib import Path
          runpy.run_path('release/runtime/scripts/release.py')['identity']()
          (Path(os.environ['RUNNER_TEMP']) / 'runtime-evidence').mkdir()
          subprocess.run([sys.executable, '-B', 'release/publisher-verification.py', '--component', 'runtime',
              '--output', str(Path(os.environ['RUNNER_TEMP']) / 'runtime-evidence/publisher.json')], check=True)
      - name: Recheck exact current-attempt proofs and artifact pins after approval
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          stage = temporary / 'runtime-stage'
          subprocess.run([sys.executable, '-B', 'release/runtime/scripts/release.py', 'stage',
              '--operation', os.environ['OPERATION'], '--candidate-release-id', os.environ['RELEASE_ID'],
              '--release-metadata-sha256', os.environ['METADATA_SHA256'],
              '--proofs', str(temporary / 'runtime-proofs'), '--output', str(stage)], check=True, timeout=420)
          snapshot = temporary / 'runtime-readback-input'
          snapshot.mkdir()
          receipt = json.loads((stage / 'input.json').read_text())
          for filename in ['input.json', *[item['filename'] for item in receipt['files']]]:
              shutil.copyfile(stage / filename, snapshot / filename)
          shutil.copyfile(stage / 'input.json', temporary / 'runtime-evidence/input.json')
          for proof in (temporary / 'runtime-proofs').glob('*.json'):
              shutil.copyfile(proof, temporary / 'runtime-evidence' / proof.name)
      - name: Publish only a separately reviewed new version once through OIDC
        id: upload
        if: ${{ inputs.operation == 'publish' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 commit
        with:
          packages-dir: ${{ runner.temp }}/runtime-stage/upload/
          attestations: true
          skip-existing: false
      - name: Verify anonymous exact public readback; on uncertainty retry reads only
        if: ${{ always() && steps.stage.outcome == 'success' }}
        shell: python
        run: |
          import os, subprocess, sys, time
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          command = [sys.executable, '-B', 'release/runtime/scripts/release.py', 'readback',
              '--directory', str(temporary / 'runtime-readback-input'),
              '--output', str(temporary / 'runtime-evidence/readback.json')]
          for attempt in range(4):
              result = subprocess.run(command, capture_output=True, text=True, timeout=120)
              if result.returncode == 0:
                  print(result.stdout)
                  break
              if attempt == 3:
                  raise SystemExit('Exact public readback failed. Inspect the registry before any further upload.')
              time.sleep(3)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: runtime-publisher-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-evidence/*.json
          if-no-files-found: warn
          retention-days: 90
